name: Backend CI

on:
  push:
    branches:
      - "main"
    paths:
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  pull_request:
    branches:
      - "main"
    paths:
      - "apps/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  workflow_dispatch:

jobs:
  backend:
    name: Backend checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        shell: bash
        working-directory: apps/backend

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile --filter aircnc-backend..." >> $GITHUB_OUTPUT
            echo "runner=pnpm --filter aircnc-backend" >> $GITHUB_OUTPUT
            echo "cache-dependency-path=pnpm-lock.yaml" >> $GITHUB_OUTPUT
          elif [ -f "${{ github.workspace }}/apps/backend/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "cache-dependency-path=apps/backend/yarn.lock" >> $GITHUB_OUTPUT
          elif [ -f "${{ github.workspace }}/apps/backend/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npm run" >> $GITHUB_OUTPUT
            echo "cache-dependency-path=apps/backend/package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Install pnpm
        if: ${{ steps.detect-package-manager.outputs.manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ steps.detect-package-manager.outputs.cache-dependency-path }}

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Typecheck
        run: ${{ steps.detect-package-manager.outputs.runner }} typecheck

      - name: Unit tests
        run: ${{ steps.detect-package-manager.outputs.runner }} test

      - name: Build backend
        run: ${{ steps.detect-package-manager.outputs.runner }} build

      - name: Start backend API
        run: |
          node dist/server.js > "$RUNNER_TEMP/aircnc-backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/healthz; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aircnc-backend.log"
          exit 1
        env:
          API_URL: http://127.0.0.1:3333
          MONGODB_URI: mongodb://127.0.0.1:27017/aircnc
          PORT: 3333

      - name: Run API end-to-end tests
        run: ${{ steps.detect-package-manager.outputs.runner }} test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-playwright-results
          path: |
            apps/backend/test-results/
            apps/backend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
