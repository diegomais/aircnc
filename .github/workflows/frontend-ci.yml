name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "apps/backend/**"
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "apps/backend/**"
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend and backend dependencies
        run: pnpm install --frozen-lockfile --filter aircnc-frontend... --filter aircnc-backend...

      - name: Lint
        run: pnpm --filter aircnc-frontend lint

      - name: Typecheck
        run: pnpm --filter aircnc-frontend typecheck

      - name: Unit tests
        run: pnpm --filter aircnc-frontend test

      - name: Build static site
        run: pnpm --filter aircnc-frontend build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3333

      - name: Build backend
        run: pnpm --filter aircnc-backend build

      - name: Start backend API
        run: |
          pnpm --filter aircnc-backend start > "$RUNNER_TEMP/aircnc-backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/healthz > /dev/null; then
              echo "Backend API is ready"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aircnc-backend.log"
          exit 1
        env:
          API_URL: http://127.0.0.1:3333
          MONGODB_URI: mongodb://127.0.0.1:27017/aircnc
          PORT: 3333

      - name: Install Playwright Chromium
        run: pnpm --filter aircnc-frontend exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter aircnc-frontend test:e2e
        env:
          API_BASE_URL: http://127.0.0.1:3333
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/aircnc
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
          BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-results
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
